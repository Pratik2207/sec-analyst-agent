[project]
name = "sec-analyst-agent"
version = "0.1.0"
description = "Local AI analyst that answers sourced questions about SEC 10-K filings"
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "fastembed>=0.4",
    "httpx>=0.27",
    "lxml>=5.2",
    "ollama>=0.5",  # chat(think=...) needs 0.5+
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "qdrant-client>=1.12,<1.13",
    "sqlglot>=25.0",
    "tokenizers>=0.19",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs the docker postgres service (and Ollama for /ask)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
